# Nginx configuration for Sahni Tata Backend
# Place this file at: /etc/nginx/sites-available/sahni-backend
# Then create symlink: sudo ln -s /etc/nginx/sites-available/sahni-backend /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-domain.com api.your-domain.com;

    # Increase body size for file uploads
    client_max_body_size 50M;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for long-running requests (migrations, etc.)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# After creating this file:
# 1. Replace 'your-domain.com' with your actual domain
# 2. Test configuration: sudo nginx -t
# 3. Reload Nginx: sudo systemctl reload nginx
# 4. Setup SSL: sudo certbot --nginx -d your-domain.com -d api.your-domain.com


